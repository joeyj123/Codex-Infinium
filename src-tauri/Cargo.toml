[package]
name = "app"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# opt-level 3's LLVM optimizer needs far more memory than this machine has to
# spare while inlining/optimizing the generated asset-embedding code from
# tauri::generate_context!() (628 embedded pages). This is a thin native
# wrapper around a webview - all real work happens in JS/Pyodide, not here -
# so a lower opt-level costs effectively nothing at runtime while cutting
# peak compiler memory use dramatically.
[profile.release]
opt-level = 1
